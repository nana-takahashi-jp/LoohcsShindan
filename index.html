<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="高校1・2年生のための総合型選抜タイプ診断。全16問・約3分で、あなたの素質と合格までの道のりがわかります。">
<title>総合型選抜タイプ診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Montserrat:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Old+Mincho:wght@600;700;900&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style id="page-style">
/* Layout: Loohcs志塾のLPに合わせた構成。深いブルーグレーの帯、明朝体の見出し、白いカード、ティールのボタンで縦に積み、結果画面では下部に相談ボタンを固定 */
/* 明るい単一テーマを意図的に採用。メイン4色は編集モードの「塾の情報・色」から変更でき、ほかの色はそこから自動で作られる */
:root{
  --brand:#32576F; --brand-2:#009EAA; --cta:#009EAA; --marker:#FBC661;
  --brand-deep:color-mix(in srgb, var(--brand) 72%, #001a2a);
  --brand-soft:color-mix(in srgb, var(--brand-2) 10%, #fff);
  --cta-shadow:color-mix(in srgb, var(--cta) 76%, #000);
  --accent:#F39A2B;
  --bg:#FFFFFF; --bg-2:#F5F5F5; --ink:#222222; --ink-2:#555555; --line:#E3E3E3; --white:#FFFFFF;
  --shadow:0 4px 16px rgba(0,0,0,.10);
  --genko:#B9644B;
  --t-social:#D46A3C; --t-research:#2E77A8; --t-create:#2B9479; --t-support:#B85583;
  --ed-bg:#141B2D; --ed-fg:#FFFFFF; --ed-mute:#AAB3CC; --ed-line:#2C3654; --ed-accent:#7FA6FF; --ed-warn:#FFB86B;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-head:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-en:"Montserrat","Zen Kaku Gothic New",sans-serif;
  --f-hand:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --s-1:.8125rem; --s0:1rem; --s1:1.125rem; --s2:1.375rem; --s3:1.75rem;
  --ed-h:0px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:var(--s0); line-height:1.85; -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0; text-wrap:balance; line-height:1.45; font-family:var(--f-head); letter-spacing:.04em}
p{margin:0}
a{color:var(--brand-2)}
:focus-visible{outline:3px solid var(--brand-2); outline-offset:3px; border-radius:6px}
.hl{background:linear-gradient(transparent 60%, var(--marker) 60%); padding:0 2px}
.hero .hl,.res-top .reversal-dark .hl,.navy .hl{background:none; color:var(--marker); padding:0}

.band{padding-block:44px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.band.alt{background:var(--bg-2)}
.band.navy{background:var(--brand); color:var(--white)}
.inner{max-width:760px; margin:0 auto; display:grid; gap:22px; min-width:0}
.sec-head{display:grid; gap:4px; text-align:center; justify-items:center}
.en{font-family:var(--f-en); font-weight:800; font-size:var(--s-1); letter-spacing:.18em; color:var(--brand-2)}
.navy .en{color:var(--marker)}
.sec-head h2{font-size:clamp(1.4rem, 5.2vw, 1.9rem); font-weight:700; color:var(--brand-2); letter-spacing:.08em}
.navy .sec-head h2{color:var(--white)}
.sec-head h2::after{content:""; display:block; width:40px; height:2px; background:currentColor; opacity:.5; margin:14px auto 0}

.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-block:12px; border-bottom:1px solid var(--line); background:var(--white);
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.logo{font-family:var(--f-head); font-weight:700; font-size:var(--s1); color:var(--brand); line-height:1.3; letter-spacing:.04em}
.logo small{display:block; font-size:.6875rem; font-weight:700; color:var(--ink-2); letter-spacing:.04em}
.top-cta{font-size:var(--s-1); font-weight:700; color:var(--white); background:var(--cta); text-decoration:none; padding:6px 16px; border-radius:999px; box-shadow:0 3px 6px rgba(69,69,69,.16)}

.btn{appearance:none; border:0; cursor:pointer; font:inherit; font-weight:900; font-size:var(--s1); text-decoration:none;
  display:inline-flex; align-items:center; justify-content:center; gap:12px; color:var(--white); background:var(--cta);
  padding:16px 32px; border-radius:999px; box-shadow:0 3px 6px rgba(69,69,69,.16); transition:filter .15s ease, transform .15s ease; text-align:center; letter-spacing:.04em}
.btn::after{content:"›"; flex:none; display:grid; place-items:center; width:26px; height:26px; border-radius:50%; background:var(--white); color:var(--cta); font-size:1.2rem; line-height:1}
.btn:hover{filter:brightness(1.08); transform:translateY(-1px)}
.btn.wide{width:100%; max-width:480px}
.btn.sub{background:var(--brand); color:var(--white); border:0}
.btn.sub::after{background:var(--white); color:var(--brand)}
.btn.small{font-size:var(--s0); padding:12px 22px}
.btn-row{display:flex; flex-wrap:wrap; gap:14px; justify-content:center}
.microcopy{font-size:var(--s-1); font-weight:700; color:var(--ink-2); text-align:center}

.hero{background:linear-gradient(170deg, var(--brand-deep) 0%, var(--brand) 100%); color:var(--white)}
.hero .inner{gap:18px; text-align:center; justify-items:center}
.badge{display:inline-block; font-weight:700; font-size:var(--s-1); color:var(--white); background:var(--accent); padding:5px 16px; border-radius:999px; letter-spacing:.06em}
.hero h1{font-weight:700; font-size:clamp(1.85rem, 7.4vw, 3rem); line-height:1.45}
.hero .lead{font-size:var(--s1); font-weight:500; max-width:32em; opacity:.95}
.meta{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:0; margin:0; list-style:none}
.meta li{font-size:var(--s-1); font-weight:700; padding:4px 12px; border-radius:999px; border:1.5px solid rgba(255,255,255,.6)}
.hero .microcopy{color:var(--white); opacity:.9}

.worries{display:grid; gap:10px; padding:0; margin:0; list-style:none}
.worries{grid-template-columns:repeat(2, minmax(0,1fr))}
.worries li{display:flex; justify-content:center; align-items:center; gap:8px; text-align:center; background:var(--white); border:1px solid var(--brand-2); color:var(--brand-2); border-radius:2px; padding:14px 16px; font-weight:700; line-height:1.6}
@media (max-width:560px){ .worries{grid-template-columns:minmax(0,1fr)} }
.bubble{position:relative; background:var(--brand); color:var(--white); font-family:var(--f-head); font-weight:700; text-align:center; border-radius:8px; padding:18px 16px; font-size:var(--s1); letter-spacing:.04em}
.bubble::before{content:""; position:absolute; top:-12px; left:50%; transform:translateX(-50%); border:12px solid transparent; border-top:0; border-bottom-color:var(--brand)}
.bubble .hl{background:none; color:var(--marker)}

.compare-wrap{overflow-x:auto}
.compare{width:100%; border-collapse:separate; border-spacing:0; min-width:520px; font-size:var(--s-1)}
.compare th,.compare td{padding:12px 14px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top}
.compare thead th{font-size:var(--s0); font-weight:700; text-align:center}
.compare thead th:nth-child(2){background:#EBEBEB; color:var(--ink-2); border-radius:8px 8px 0 0}
.compare thead th:nth-child(3){background:var(--brand-2); color:var(--white); border-radius:8px 8px 0 0}
.compare tbody th{font-weight:700; color:var(--ink-2); white-space:nowrap}
.compare td:nth-child(3){background:var(--brand-soft); font-weight:700}
.fine{font-size:.75rem; color:var(--ink-2); line-height:1.7}

.types{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px}
.type-card{display:flex; gap:14px; align-items:center; padding:16px; background:var(--white); border-radius:8px; box-shadow:var(--shadow); min-width:0}
.type-card h3{font-size:var(--s0); font-weight:700}
.type-card p{font-size:var(--s-1); color:var(--ink-2); line-height:1.6}
@media (max-width:560px){ .types{grid-template-columns:minmax(0,1fr)} }
.stamp{--tc:var(--brand); flex:none; width:52px; height:52px; display:grid; place-items:center; font-weight:900; font-size:1.5rem; color:var(--tc);
  border:3px solid var(--tc); border-radius:10px; transform:rotate(-6deg); background:var(--white);
  box-shadow:inset 0 0 0 2px var(--white), inset 0 0 0 3.5px var(--tc)}
.stamp.big{width:92px; height:92px; font-size:2.8rem; border-width:4px; border-radius:14px; box-shadow:inset 0 0 0 3px var(--white), inset 0 0 0 5px var(--tc)}

.quiz-band{background:var(--bg-2); min-height:70vh}
.qcard{background:var(--white); box-shadow:var(--shadow); border-radius:8px; padding:clamp(20px,5vw,32px); display:grid; gap:16px}
.progress{display:grid; gap:8px}
.progress-top{display:flex; justify-content:space-between; gap:8px; font-size:var(--s-1); font-weight:700; color:var(--ink-2); font-variant-numeric:tabular-nums}
.bar{height:8px; border-radius:99px; background:var(--brand-soft); overflow:hidden}
.bar span{display:block; height:100%; background:var(--brand-2); border-radius:99px; transition:width .3s ease}
.qnum{font-family:var(--f-en); font-weight:800; font-size:var(--s3); color:var(--brand-2); line-height:1}
.qtext{font-size:var(--s2); font-weight:700}
.qhint{font-size:var(--s-1); color:var(--ink-2); margin-top:-8px}
.opts{display:grid; gap:10px}
.opt{appearance:none; font:inherit; text-align:left; cursor:pointer; color:var(--ink); background:var(--white); border:1px solid var(--line); border-radius:8px; padding:13px 16px;
  display:grid; grid-template-columns:30px minmax(0,1fr); gap:12px; align-items:center; font-weight:500; transition:border-color .15s ease, background .15s ease}
.opt:hover{border-color:var(--brand-2)}
.opt .key{width:30px; height:30px; border-radius:50%; background:var(--brand-soft); color:var(--brand-2); display:grid; place-items:center; font-family:var(--f-en); font-weight:800; font-size:var(--s-1)}
.opt.on{border-color:var(--brand-2); background:var(--brand-soft)}
.opt.on .key{background:var(--brand-2); color:var(--white)}
.opt .map{grid-column:2; font-size:.75rem; font-weight:700; color:var(--ink-2)}
.linkbtn{appearance:none; background:none; border:0; font:inherit; font-weight:700; color:var(--ink-2); cursor:pointer; padding:6px 0; justify-self:start}
.linkbtn:hover{color:var(--ink)}

.res-top{background:linear-gradient(170deg, var(--brand-deep) 0%, var(--brand) 100%); color:var(--white)}
.res-card{background:var(--white); color:var(--ink); border-radius:8px; padding:clamp(20px,5vw,32px); display:grid; gap:14px; justify-items:center; text-align:center}
.res-label{font-weight:900; color:var(--brand); font-size:var(--s-1); letter-spacing:.08em}
.res-name{font-weight:900; letter-spacing:.06em; font-size:clamp(1.8rem, 7vw, 2.6rem); color:var(--tc); line-height:1.25}
.res-catch{font-weight:700; font-size:var(--s1)}
.res-desc{text-align:left; max-width:36em}
.res-note{font-size:var(--s-1); color:var(--ink-2); background:var(--bg-2); border-radius:8px; padding:8px 12px; text-align:left}

.reversal{background:var(--white); border-top:4px solid var(--marker); border-radius:8px; padding:clamp(20px,5vw,30px); display:grid; gap:12px; color:var(--ink)}
.reversal .kicker{font-weight:700; color:var(--accent); font-size:var(--s-1); letter-spacing:.06em}
.reversal h3{font-size:clamp(1.25rem, 4.6vw, 1.6rem); font-weight:700}
.fact{display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; align-items:center; background:var(--brand-soft); border-radius:10px; padding:12px 14px}
.fact b{font-family:var(--f-en); font-weight:800; color:var(--white); background:var(--brand); border-radius:6px; padding:2px 8px; font-size:var(--s-1); letter-spacing:.06em}
.fact span{font-weight:700; font-size:var(--s-1)}

.traits{display:grid; gap:14px}
.trait{display:grid; grid-template-columns:5.5em minmax(0,1fr) 4em; gap:12px; align-items:center}
.trait-name{font-weight:900}
.trait-track{height:16px; border-radius:99px; background:var(--brand-soft); overflow:hidden}
.trait-fill{height:100%; border-radius:99px; background:var(--brand-2)}
.trait.top .trait-fill{background:var(--accent)}
.trait-tag{font-size:.75rem; font-weight:900; text-align:center; border-radius:4px; padding:2px 0; color:var(--brand-2); background:var(--brand-soft)}
.trait.top .trait-tag{color:var(--white); background:var(--accent)}
.panel{background:var(--white); box-shadow:var(--shadow); border-radius:8px; padding:clamp(18px,5vw,28px); display:grid; gap:14px; min-width:0}
.panel h3{font-size:var(--s1); font-weight:700; display:flex; gap:8px; align-items:center}
.panel h3::before{content:""; flex:none; width:6px; height:1.2em; border-radius:3px; background:var(--tc, var(--brand-2))}
.list{margin:0; padding:0; list-style:none; display:grid; gap:8px}
.list li{display:grid; grid-template-columns:22px minmax(0,1fr); gap:8px}
.list li::before{content:"●"; color:var(--tc, var(--brand-2)); font-size:.7rem; line-height:2.6}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chips > span{font-size:var(--s-1); font-weight:700; padding:4px 12px; border-radius:999px; border:1.5px solid var(--tc); background:var(--white); display:inline-flex; gap:6px; align-items:center}

.start-type{display:grid; grid-template-columns:auto minmax(0,1fr); gap:16px; align-items:center}
.start-type .pill{font-family:var(--f-head); font-weight:700; color:var(--white); background:var(--brand); border-radius:8px; padding:10px 14px; text-align:center; line-height:1.4; display:grid}
.start-type .pill small{font-size:.6875rem; font-weight:700; opacity:.85}
@media (max-width:480px){ .start-type{grid-template-columns:minmax(0,1fr)} }

.lv-meter{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:4px}
.lv-meter span{font-size:.75rem; font-weight:900; text-align:center; padding:6px 4px; background:var(--bg-2); color:var(--ink-2); line-height:1.3}
.lv-meter span:first-child{border-radius:8px 0 0 8px}
.lv-meter span:last-child{border-radius:0 8px 8px 0}
.lv-meter span.on{background:var(--brand-soft); color:var(--brand)}
.lv-meter span.cur{background:var(--brand); color:var(--white)}

.case{background:var(--white); box-shadow:var(--shadow); border-radius:8px; padding:clamp(16px,4vw,26px); display:grid; gap:10px; min-width:0}
.case-band{padding-bottom:30px}
.case-band .inner{gap:16px}
.case-note{text-align:center; margin-top:-4px}
.walls-band{position:relative; padding-top:52px}
.walls-band::before{content:""; position:absolute; top:-1px; left:50%; transform:translateX(-50%); border:22px solid transparent; border-bottom:0; border-top:18px solid var(--bg-2)}
.walls-kicker{justify-self:center; text-align:center; font-weight:700; font-size:var(--s-1); color:var(--brand); background:var(--marker); border-radius:999px; padding:6px 16px; line-height:1.5}
.walls-lead{text-align:center; max-width:34em; justify-self:center; opacity:.9}
.case-title{font-size:clamp(1.1rem, 4.2vw, 1.35rem); font-weight:700; text-align:center}
.case-flow{display:grid; gap:0; justify-items:stretch}
.case-box{border-radius:8px; padding:10px 14px; background:var(--bg-2); display:grid; gap:8px; min-width:0}
.case-lbl{font-size:.75rem; font-weight:900; letter-spacing:.06em; color:var(--brand-2)}
.case-chips{display:flex; flex-wrap:wrap; gap:6px}
.case-chips > span{font-size:var(--s-1); font-weight:700; background:var(--white); border:1px solid var(--line); border-radius:6px; padding:2px 10px; display:inline-flex; gap:6px; align-items:center}
.case-steps{margin:0; padding:0; list-style:none; counter-reset:cs; display:grid; gap:4px}
.case-steps li{counter-increment:cs; display:grid; grid-template-columns:22px minmax(0,1fr); gap:8px; align-items:start; font-weight:500; font-size:var(--s-1); line-height:1.7}
.case-steps li::before{content:counter(cs); width:20px; height:20px; border-radius:50%; background:var(--tc); color:var(--white); display:grid; place-items:center; font-family:var(--f-en); font-weight:800; font-size:.6875rem; margin-top:2px}
.editing .case-steps li{grid-template-columns:24px minmax(0,1fr) auto}
.case-arrow{height:14px; position:relative}
.case-arrow::before{content:""; position:absolute; left:50%; top:2px; transform:translateX(-50%); border:7px solid transparent; border-bottom:0; border-top:9px solid var(--brand-2)}
.case-after{background:var(--brand); color:var(--white)}
.case-after .case-lbl{color:var(--marker)}
.case-result{font-family:var(--f-head); font-size:clamp(1.1rem, 4.4vw, 1.4rem); font-weight:700; line-height:1.5; letter-spacing:.04em}
.case-close{font-size:var(--s-1); font-weight:700; color:var(--marker)}
.case-after [data-edit]{outline-color:rgba(255,255,255,.6)}

.road{margin:0; padding:0; list-style:none; display:grid}
.road li{display:grid; grid-template-columns:40px minmax(0,1fr); gap:14px; position:relative; padding-bottom:18px}
.road li:not(:last-child)::after{content:""; position:absolute; left:19px; top:40px; bottom:0; width:2px; background:var(--line)}
.road .dot{width:40px; height:40px; border-radius:50%; background:var(--brand); color:var(--white); display:grid; place-items:center; font-family:var(--f-en); font-weight:800}
.road .when{font-size:var(--s-1); font-weight:900; color:var(--brand-2)}
.road .what{font-weight:700}
.road .help{display:inline-block; margin-top:4px; font-size:.75rem; font-weight:700; color:var(--accent); border:1.5px solid var(--accent); border-radius:4px; padding:0 6px}

.walls{display:grid; gap:12px; grid-template-columns:repeat(3, minmax(0,1fr))}
.wall{background:var(--white); border-radius:8px; padding:18px; display:grid; gap:8px; align-content:start; color:var(--ink)}
.wall .no{font-family:var(--f-en); font-weight:800; color:var(--brand-2); font-size:var(--s-1); letter-spacing:.1em}
.wall h3{font-size:var(--s0); font-weight:700}
.wall p{font-size:var(--s-1); color:var(--ink-2); line-height:1.7}
.walls-close{text-align:center; font-weight:700}
@media (max-width:640px){ .walls{grid-template-columns:minmax(0,1fr)} }

.genko{display:grid; grid-template-columns:repeat(20, minmax(0,1fr)); border:2px solid var(--genko); background:var(--white)}
.genko span{aspect-ratio:1; display:grid; place-items:center; border-right:1px solid var(--genko); border-bottom:1px solid var(--genko);
  font-family:var(--f-hand); font-weight:600; font-size:clamp(.6rem, 2.6vw, 1.05rem); line-height:1; min-width:0}
.genko span:nth-child(20n){border-right:0}
.genko span.last-row{border-bottom:0}
.genko span.p{place-items:start start; padding:2px 0 0 3px}
.genko-edit{font-family:var(--f-hand); font-weight:600; font-size:var(--s1); border:2px solid var(--genko); padding:14px; background:var(--white)}

.cta-box{background:var(--white); border-top:4px solid var(--cta); box-shadow:var(--shadow); border-radius:8px; padding:clamp(20px,5vw,32px); display:grid; gap:16px; justify-items:center; text-align:center}
.cta-box h2{font-size:clamp(1.3rem, 5vw, 1.75rem); font-weight:700; color:var(--brand)}
.benefits{margin:0; padding:0; list-style:none; counter-reset:b; display:grid; gap:10px; width:100%; max-width:520px; text-align:left}
.benefits li{counter-increment:b; display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; align-items:center; background:var(--bg-2); border-radius:8px; padding:10px 14px; font-weight:700}
.benefits li::before{content:"0" counter(b); font-family:var(--f-en); font-weight:800; font-size:.75rem; color:var(--white); background:var(--cta); border-radius:4px; padding:2px 8px; letter-spacing:.06em}
.cta-notes{display:flex; flex-wrap:wrap; gap:6px 16px; justify-content:center; font-size:var(--s-1); font-weight:700; color:var(--ink-2)}
.cta-notes span::before{content:"○ "; color:var(--cta)}
.setup{border:1.5px dashed var(--genko); color:var(--ink-2); border-radius:10px; padding:10px 14px; font-size:var(--s-1); max-width:480px}

.share-text{width:100%; font:inherit; font-size:var(--s-1); color:var(--ink); background:var(--bg-2); border:1px solid var(--line); border-radius:8px; padding:10px; resize:none}

const clone = o => JSON.parse(JSON.stringify(o));
const isObj = v => v && typeof v === "object" && !Array.isArray(v);
function merge(base, over) {
  if (over === undefined || over === null) return clone(base);
  if (isObj(base) && isObj(over)) {
    const out = {};
    new Set([...Object.keys(base), ...Object.keys(over)]).forEach(k => { out[k] = k in over ? merge(base[k], over[k]) : clone(base[k]); });
    return out;
  }
  return clone(over);
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = s => esc(s).replace(/==(.+?)==/g, '<span class="hl">$1</span>').replace(/\n/g, "<br>");
const get = (o, p) => p.split(".").reduce((x, k) => (x == null ? undefined : x[k]), o);
function set(o, p, v) { const ks = p.split("."); const last = ks.pop(); const t = ks.reduce((x, k) => x[k], o); t[last] = v; }
const ss = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
};

function E(tag, path, attrs, ctx) {
  const raw = get(D(), path) ?? "";
  const a = attrs ? " " + attrs : "";
  if (EDIT) return `<${tag}${a} data-edit="${path}">${esc(raw)}</${tag}>`;
  return `<${tag}${a}>${md(fill(raw, ctx || baseCtx()))}</${tag}>`;
}
function LIST(path, attrs, ctx, wrap = "ul", item = "li") {
  const arr = get(D(), path) || [];
  const items = arr.map((v, i) => EDIT
    ? `<${item}><span data-edit="${path}.${i}">${esc(v)}</span><button type="button" class="x" data-del="${path}.${i}" aria-label="この項目を削除">×</button></${item}>`
    : `<${item}><span>${md(fill(v, ctx || baseCtx()))}</span></${item}>`).join("");
  return `<${wrap} ${attrs}>${items}</${wrap}>` + (EDIT ? `<button type="button" class="add" data-add="${path}">+ 項目を追加</button>` : "");
}

function quizHTML(path, pos, total, chosen) {

/* ---------- 判定 ---------- */
function compute() {
  const r = { grade: "1", bunri: "both", dev: "unknown", goal: "undecided", exp: 0, talk: 0 };
  const score = { social: 0, research: 0, create: 0, support: 0 };
  const trait = Object.fromEntries(TRAITS.map(t => [t, 0]));
  let tie = null;
  quizState.seq.forEach(path => {
    const a = quizState.ans[path]; if (a == null) return;
    const q = Q(path), o = q.options[a];
    if (q.kind === "type") { score[o.t] += 1; o.tr.forEach(t => trait[t] += 1); if (q.tie) tie = o.t; }
    else if (q.kind === "talk") { r.talk = o.v; trait["伝える力"] += o.v * 0.5; }
    else if (o.v != null) r[q.kind] = o.v;
  });
  r.level = levelOf(levelScore());
  r.tier = r.level === "L1" ? "L2" : r.level; // 表示上のランクは、誰でも2段目以上
  const top = Math.max(...Object.values(score));
  const tied = ORDER.filter(k => score[k] === top);
  r.type = tied.includes(tie) ? tie : tied[0];
  const maxT = Math.max(...Object.values(trait), 1);
  const ranked = [...TRAITS].sort((a, b) => trait[b] - trait[a]);
  r.topTraits = ranked.slice(0, 2);
  r.traits = TRAITS.map(t => ({ name: t, pct: Math.round(35 + 65 * (trait[t] / maxT)), top: r.topTraits.includes(t) }));
  return r;
}
function previewResult() {
  const p = view.pv, top = SAMPLE_TOP[p.type];
  return { grade: p.grade, bunri: p.bunri, dev: { L1: "low", L2: "mid", L3: "high" }[p.level], goal: p.goal, type: p.type, level: p.level, tier: p.level === "L1" ? "L2" : p.level, topTraits: top,
    traits: TRAITS.map((t, i) => ({ name: t, pct: top.includes(t) ? (t === top[0] ? 100 : 86) : 50 + i * 4, top: top.includes(t) })) };
}

function genko(text) {
  const chars = ["", ...Array.from(text)];
  const cells = Math.ceil((chars.length + 20) / 20) * 20, rows = cells / 20;
  let html = "";
  for (let i = 0; i < cells; i++) {
    const c = chars[i] || "", cls = [];
    if (i >= (rows - 1) * 20) cls.push("last-row");
    if (c === "、" || c === "。") cls.push("p");
    html += `<span${cls.length ? ` class="${cls.join(" ")}"` : ""}>${esc(c)}</span>`;
  }
  return `<div class="genko" role="img" aria-label="${esc(text)}">${html}</div>`;
}

/* ---------- 描画 ---------- */
let lastResult = null;
function render() {
  applyColors();
  let body = "";
  if (view.screen === "intro") body = introHTML();
  else if (view.screen === "quiz") {
    if (EDIT) { const seq = seqFor(view.branch); body = quizHTML(seq[view.qi], view.qi, seq.length, null); }
    else { const path = quizState.seq[quizState.pos]; body = quizHTML(path, quizState.pos, quizState.seq.length, quizState.ans[path]); }
  }
  else body = resultHTML(EDIT ? previewResult() : lastResult);
  root.innerHTML = topbar() + `<main>${body}</main>` +
    (view.screen === "result" && !EDIT ? `<div class="fixed-cta"><a class="btn" href="#consult">${esc(D().config.fixedLabel)}</a></div>` : "") + footer();
  document.body.classList.toggle("has-fixed", view.screen === "result" && !EDIT);
  if (EDIT) wireEditable(); else wireNormal();
}

function wireNormal() {
  root.querySelectorAll(".start").forEach(b => b.onclick = () => { startQuiz(); view.screen = "quiz"; render(); window.scrollTo(0, 0); });
  root.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const path = quizState.seq[quizState.pos];
    quizState.ans[path] = Number(b.dataset.k);
    root.querySelectorAll(".opt").forEach(x => x.classList.toggle("on", x === b));
    setTimeout(() => {
      // 共通の質問が終わったら、レベルに合わせて次からの質問を切り替える
      if (quizState.pos === D().questions.common.length - 1) {
        const br = branchOf(levelScore());
        if (br !== quizState.branch) { quizState.branch = br; quizState.seq = seqFor(br); }
      }
      if (quizState.pos < quizState.seq.length - 1) quizState.pos++;
      else { lastResult = compute(); view.screen = "result"; }
      render(); window.scrollTo(0, 0);
    }, 180);
  });
  const back = document.getElementById("back");
  if (back) back.onclick = () => { if (quizState.pos === 0) view.screen = "intro"; else quizState.pos--; render(); window.scrollTo(0, 0); };
  const copy = document.getElementById("copy");
  if (copy) copy.onclick = () => {
    const ta = document.getElementById("shareText"), toast = document.getElementById("toast");
    const fallback = () => { ta.focus(); ta.select(); toast.textContent = "文章を選択しました。コピーして使ってください"; };
    try { navigator.clipboard.writeText(ta.value).then(() => { toast.textContent = "コピーしました"; }, fallback); } catch (e) { fallback(); }
  };
  const retry = document.getElementById("retry");
  if (retry) retry.onclick = () => { view.screen = "intro"; render(); window.scrollTo(0, 0); };
}

/* ============================================================
   編集モード
   ============================================================ */
let bar, drawer, fab;

function wireEditable() {
  root.querySelectorAll("[data-edit]").forEach(el => {
    el.setAttribute("contenteditable", "plaintext-only");
    if (el.contentEditable !== "plaintext-only") el.setAttribute("contenteditable", "true");
    el.spellcheck = false;
  });
}
function readText(el) { return el.innerText.replace(/ /g, " ").replace(/\n+$/, ""); }
function markDirty() { DIRTY = true; updateStatus(); }
function updateStatus(text) {
  const s = document.getElementById("ed-status"); if (!s) return;
  s.textContent = text || (DIRTY ? "未保存の変更があります" : "変更はありません");
  s.classList.toggle("dirty", DIRTY && !text);
  const save = document.getElementById("ed-save"); if (save) save.disabled = !DIRTY;
}

root.addEventListener("focusout", e => {
  if (!EDIT) return;
  const el = e.target.closest && e.target.closest("[data-edit]"); if (!el) return;
  const path = el.dataset.edit, v = readText(el);
  if (get(DRAFT, path) !== v) { set(DRAFT, path, v); markDirty(); }
});
root.addEventListener("paste", e => {
  if (!EDIT) return;
  const el = e.target.closest && e.target.closest("[data-edit]");
  if (!el || el.contentEditable === "plaintext-only") return;
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData("text/plain");
  document.execCommand("insertText", false, text);
});
root.addEventListener("click", e => {
  if (!EDIT) return;
  const a = e.target.closest("a"); if (a) e.preventDefault();
  const del = e.target.closest(".x");
  if (del) {
    commitFocused();
    const p = del.dataset.del.split("."), i = Number(p.pop()), arr = get(DRAFT, p.join("."));
    arr.splice(i, 1); markDirty(); render(); return;
  }
  const add = e.target.closest(".add");
  if (add) {
    commitFocused();
    const path = add.dataset.add, arr = get(DRAFT, path);
    arr.push("新しい項目"); markDirty(); render();
    const el = root.querySelector(`[data-edit="${path}.${arr.length - 1}"]`);
    if (el) { el.focus(); const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  }
});
function commitFocused() {
  const el = document.activeElement;
  if (el && el.dataset && el.dataset.edit) { const v = readText(el); if (get(DRAFT, el.dataset.edit) !== v) { set(DRAFT, el.dataset.edit, v); DIRTY = true; } }
}

function enterEdit(draft) {
  EDIT = true; DIRTY = !!draft; DRAFT = draft ? merge(DEFAULTS, draft) : clone(DATA);
  if (view.screen === "result" && lastResult) view.pv = { type: lastResult.type, grade: lastResult.grade, goal: lastResult.goal, level: lastResult.level, bunri: lastResult.bunri };
  if (view.screen === "quiz") { view.branch = quizState.branch; view.qi = quizState.pos; }
  document.body.classList.add("editing");
  if (fab) fab.hidden = true;
  buildBar(); render(); updateStatus();
}
function exitEdit() {
  EDIT = false; DRAFT = null; DIRTY = false;
  document.body.classList.remove("editing");
  if (bar) { bar.remove(); bar = null; }
  closeDrawer();
  if (view.screen === "result" && !lastResult) view.screen = "intro";
  if (view.screen === "quiz") { startQuiz(); view.screen = "intro"; }
  if (fab) fab.hidden = false;
  render();
}

function syncBar() {

  const total = seqFor(view.branch).length;
  if (view.screen === "quiz") {
    sub.innerHTML = `<label class="ed-sel-wrap">ルート<select class="ed-sel" id="ed-branch"><option value="basic"${view.branch === "basic" ? " selected" : ""}>基本(成績・実績がこれからの生徒向け)</option><option value="advanced"${view.branch === "advanced" ? " selected" : ""}>発展(成績・実績がある生徒向け)</option></select></label>
      <button type="button" class="ed-btn" id="ed-prev">← 前</button><span>Q${view.qi + 1} / ${total}</span><button type="button" class="ed-btn" id="ed-next">次 →</button>`;
    document.getElementById("ed-branch").onchange = e => { commitFocused(); view.branch = e.target.value; syncBar(); render(); };
    document.getElementById("ed-prev").onclick = () => { commitFocused(); view.qi = Math.max(0, view.qi - 1); syncBar(); render(); };
    document.getElementById("ed-next").onclick = () => { commitFocused(); view.qi = Math.min(total - 1, view.qi + 1); syncBar(); render(); };
    tip.innerHTML = "最初の7問の答えでレベルを判定し、8問目からは「基本」か「発展」の質問に分かれます。文章は書き換えられますが、点の入り方は変わりません。";
  } else if (view.screen === "result") {
    const opt = (id, label, pairs, cur) => `<label class="ed-sel-wrap">${label}<select class="ed-sel" id="${id}">${pairs.map(([v, l]) => `<option value="${v}"${v === cur ? " selected" : ""}>${esc(l)}</option>`).join("")}</select></label>`;
    const pv = view.pv;
    sub.innerHTML =
      opt("pv-type", "タイプ", ORDER.map(k => [k, D().types[k].name]), pv.type) +
      opt("pv-grade", "学年", [["1", "高1"], ["2", "高2"]], pv.grade) +
      opt("pv-bunri", "文理", [["bun", "文系"], ["ri", "理系"], ["both", "未定"]], pv.bunri) +
      opt("pv-goal", "本音", [["dream", "難関大は無理だと思う"], ["on", "難関大に届きそう"], ["undecided", "志望校が未定"], ["unsure", "進学を迷っている"]], pv.goal) +
      opt("pv-level", "レベル", [["L1", "成績・実績これから(チャレンジ型として表示)"], ["L2", "土台あり(チャレンジ型)"], ["L3", "上位層(難関大射程型)"]], pv.level);
    ["type", "grade", "bunri", "goal", "level"].forEach(k => { document.getElementById("pv-" + k).onchange = e => { commitFocused(); view.pv[k] = e.target.value; render(); }; });
    tip.innerHTML = "上の選択を変えると、ほかの結果パターン(合格モデルはタイプ×レベル×文理の組み合わせ)も編集できます。<code>{タイプ名}</code><code>{レベル}</code><code>{武器1}</code><code>{武器2}</code><code>{学年}</code><code>{偏差値}</code><code>{塾名}</code> は診断結果に合わせて自動で入れ替わります。";
  } else {
    sub.innerHTML = "";
    tip.innerHTML = "点線の文章をタップすると、その場で書き換えられます。<code>==文字==</code> で囲むとマーカー、改行もそのまま反映されます。";
  }
}
function showMsg(html, ok) { const m = document.getElementById("ed-msg"); if (!m) return; m.innerHTML = html; m.classList.toggle("ok", !!ok); m.hidden = false; }
function hideMsg() { const m = document.getElementById("ed-msg"); if (m) m.hidden = true; }

/* ---------- 設定パネル ---------- */
function openDrawer() {
  const c = DRAFT.config, col = DRAFT.colors;
  drawer = document.createElement("div");
  drawer.className = "ed-drawer"; drawer.setAttribute("role", "dialog"); drawer.setAttribute("aria-label", "塾の情報と色");
  const f = (id, label, val, hint, type = "text") => `<div class="ed-field"><label for="${id}">${label}</label><input type="${type}" id="${id}" value="${esc(val)}">${hint ? `<small>${hint}</small>` : ""}</div>`;
  const cl = (id, label, val, hint) => `<label class="ed-color" for="${id}"><input type="color" id="${id}" value="${esc(val)}"><span><b>${label}</b><small>${hint}</small></span></label>`;
  drawer.innerHTML = `
    <div class="ed-drawer-head"><h2>塾の情報・色</h2><button type="button" class="ed-close" id="ed-drawer-close">閉じる</button></div>
    ${f("cf-name", "塾名・校舎名", c.schoolName)}
    ${f("cf-tag", "塾名の下の説明", c.schoolTag)}
    ${f("cf-url", "無料相談の予約ページURL", c.ctaUrl, "https:// から入れてください。空のままだと「設定待ち」と表示されます。", "url")}
    ${f("cf-label", "予約ボタンの文字", c.ctaLabel)}
    ${f("cf-line", "LINE公式アカウントのURL", c.lineUrl, "空のままならLINEボタンは表示されません。", "url")}
    ${f("cf-linelabel", "LINEボタンの文字", c.lineLabel)}
    ${f("cf-fixed", "結果画面の下に出るボタンの文字", c.fixedLabel)}
    ${f("cf-top", "右上のボタンの文字", c.topLabel)}
    <div class="ed-field"><label for="cf-notes">相談の特徴(1行に1つ)</label><textarea id="cf-notes" rows="4">${esc(c.ctaNotes.join("\n"))}</textarea></div>
    ${f("cf-site", "シェアするときのURL", c.siteUrl, "塾のサイトに載せる場合はそのURL。空のままなら今のページのURLになります。", "url")}
    <h2>色</h2>
    <div class="ed-colors">
      ${cl("cc-brand", "メイン", col.brand, "背景の帯・ロゴ")}
      ${cl("cc-brand2", "サブ", col.brand2, "見出し・枠線")}
      ${cl("cc-cta", "相談ボタン", col.cta, "ボタン・強調")}
      ${cl("cc-marker", "マーカー", col.marker, "金色の強調・線")}
    </div>
    <button type="button" class="ed-reset" id="cc-reset">色を最初の状態に戻す</button>`;
  document.body.appendChild(drawer);
  const bind = (id, path, transform) => { const el = document.getElementById(id); el.oninput = () => { set(DRAFT, path, transform ? transform(el.value) : el.value); markDirty(); }; };
  bind("cf-name", "config.schoolName"); bind("cf-tag", "config.schoolTag"); bind("cf-url", "config.ctaUrl", v => v.trim());
  bind("cf-label", "config.ctaLabel"); bind("cf-line", "config.lineUrl", v => v.trim()); bind("cf-linelabel", "config.lineLabel");
  bind("cf-fixed", "config.fixedLabel"); bind("cf-top", "config.topLabel"); bind("cf-site", "config.siteUrl", v => v.trim());
  bind("cf-notes", "config.ctaNotes", v => v.split("\n").map(s => s.trim()).filter(Boolean));
  [["cc-brand", "brand"], ["cc-brand2", "brand2"], ["cc-cta", "cta"], ["cc-marker", "marker"]].forEach(([id, k]) => {
    const el = document.getElementById(id);
    el.oninput = () => { DRAFT.colors[k] = el.value; el.nextElementSibling.querySelector("small").textContent = el.value.toUpperCase(); applyColors(); markDirty(); };
    el.nextElementSibling.querySelector("small").textContent = el.value.toUpperCase();
  });
  document.getElementById("cc-reset").onclick = () => { DRAFT.colors = clone(DEFAULTS.colors); markDirty(); closeDrawer(); openDrawer(); applyColors(); };
  document.getElementById("ed-drawer-close").onclick = closeDrawer;
  document.getElementById("ed-settings").classList.add("on");
}
function closeDrawer() {
  if (!drawer) return;
  drawer.remove(); drawer = null;
  const b = document.getElementById("ed-settings"); if (b) b.classList.remove("on");
  if (EDIT) render();
}

/* ---------- 保存 ---------- */
const SKELETON_OPEN = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>';
const HEAD_PART = '<title>総合型選抜タイプ診断</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Montserrat:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Old+Mincho:wght@600;700;900&display=swap">\n';
function buildDocument(data) {
  const style = document.getElementById("page-style").textContent;
  const app = document.getElementById("app-script").textContent;
  const json = JSON.stringify(data).replace(/</g, "\\u003c");
  return SKELETON_OPEN + HEAD_PART +
    '<style id="page-style">' + style + "</style>\n" +
    '<div id="root"></div>\n' +
    '<script type="application/json" id="page-data">' + json + "<\/script>\n" +
    '<script id="app-script">' + app + "<\/script>" +
    "</body></html>";
}
async function save() {
  commitFocused();
  if (!DIRTY || !ARTIFACT) return;
  const btn = document.getElementById("ed-save"); btn.disabled = true;
  updateStatus("保存しています…"); hideMsg();
  ss.set(DRAFT_KEY, JSON.stringify(DRAFT));
  try {
    await ARTIFACT.publish(buildDocument(DRAFT));
    DATA = clone(DRAFT); DIRTY = false;
    showMsg("保存しました。公開ページに反映しています…", true);
    updateStatus("保存しました");
  } catch (err) {
    const code = err && err.code;
    const msgs = {
      conflict: "ほかの場所で先にページが更新されたため、最新の内容を読み込みます。今回の編集内容は、読み込み後に復元できます。",
      not_writer: "このページを編集する権限がないため、保存できません。",
      not_granted: "このページを編集する権限がないため、保存できません。",
      consent_required: "このページを編集する権限がないため、保存できません。",
      rate_limited: "短い時間に保存が続いたため、受け付けられませんでした。少し待ってから、もう一度「保存して公開」を押してください。",
      too_large: "ページの内容が大きすぎて保存できませんでした。長い文章を短くしてから、もう一度お試しください。",
      invalid_content: "保存できない形式になっていました。Claudeに「編集モードで保存できない」と伝えてください。",
      not_declared: "このページの保存機能が無効になっています。Claudeに「編集モードで保存できない」と伝えてください。"
    };
    showMsg(msgs[code] || "通信の問題で保存できませんでした。もう一度「保存して公開」を押してください。");
    updateStatus();
    btn.disabled = false;
    if (code === "not_writer" || code === "not_granted" || code === "consent_required") ss.del(DRAFT_KEY);
  }
}

/* ---------- 起動 ---------- */
render();

(async function initEditor() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  let art = null, user = null;
  try { [art, user] = await Promise.all([window.claude.use("artifact"), window.claude.use("user")]); } catch (e) { return; }
  if (!art || !user) return;
  let canEdit = false;
  try { canEdit = await user.canEdit(); } catch (e) {}
  if (!canEdit) return;
  ARTIFACT = art;
  fab = document.createElement("button");
  fab.type = "button"; fab.className = "ed-fab"; fab.textContent = "✎ このページを編集";
  fab.onclick = () => enterEdit(null);
  document.body.appendChild(fab);

  const saved = ss.get(DRAFT_KEY);
  if (saved) {
    if (saved === JSON.stringify(DATA)) { ss.del(DRAFT_KEY); return; }
    let draft = null; try { draft = JSON.parse(saved); } catch (e) { ss.del(DRAFT_KEY); return; }
    enterEdit(draft);
    showMsg(`保存されていない編集内容を復元しました。 <button type="button" class="ed-btn" id="ed-drop">復元をやめて最新の状態に戻す</button>`);
    document.getElementById("ed-drop").onclick = () => { ss.del(DRAFT_KEY); DRAFT = clone(DATA); DIRTY = false; hideMsg(); render(); updateStatus(); };
  }
})();

window.__shindan = { buildDocument, enterEdit, get DRAFT() { return DRAFT; } };
})();
</script>
